# 在 tag 推送时为 Windows x86_64 构建便携 zip 并附加到对应 release。
#
# 产物：TokenClock-windows-x86_64.zip = TokenClock.exe + Swift 运行时 DLL（动态链接，工具链无静态库）
# + VC++ 运行时，自包含（Windows 加载器优先搜 exe 目录）。下载即用；cli/install.ps1 提供一键安装。
#
# 注意：
# - Windows 源码在 windows-port 分支；release tag 必须从「含 Windows 源码的提交」打出（合并到 main 后），
#   否则 checkout 出来的源码没有 Sources/Win32Shim 与 Sources/TokenClock/Windows。
# - Swift on Windows 的 GHA setup 偶有版本/SDK 抖动；若 setup-swift 步骤失败，按报错调 swift-version。
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:       # 允许手动触发，便于不打 tag 验证

permissions:
  contents: write          # 附加资产到 release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 默认 checkout 触发 tag 的提交；确保该提交含 Windows 源码（见文件头说明）。

      - name: Setup Swift
        uses: swiftpackage/setup-swift@v2
        with:
          swift-version: '6.0.3'

      - name: Setup VS Developer Environment
        uses: compnerd/gha-setup-vsenv@v1

      - name: Build + bundle + zip
        shell: pwsh
        run: pwsh scripts/build-windows.ps1 -Zip

      - name: Attach zip + SHA256 to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            TokenClock-windows-x86_64.zip
            TokenClock-windows-x86_64.zip.sha256
