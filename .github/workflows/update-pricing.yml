# Publish validated catalog-only updates directly; no PR approval is required.
name: update-pricing
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test catalog safeguards
        run: python3 -m unittest discover -s scripts -p 'test_pricing_snapshot.py'
      - name: Generate validated snapshot
        run: python3 scripts/update-pricing-snapshot.py
      - name: Publish catalog only
        shell: bash
        run: |
          set -euo pipefail
          snapshot=Sources/TokenClock/Resources/pricing-snapshot.json
          if git diff --quiet -- "$snapshot"; then
            echo "Catalog unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$snapshot"
          git commit -m "chore(pricing): refresh validated catalog"
          # Never force-push or bypass branch protection. A concurrent unrelated
          # commit can be rebased safely; conflicts fail without changing main.
          git pull --rebase origin main
          git push origin HEAD:main
