name: Platform parity Windows validation
on:
  push:
    branches: [codex/platform-parity-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
          cache: true
      - name: Native regression
        shell: pwsh
        run: |
          swift test -c release --jobs 2 2>&1 | Tee-Object -FilePath native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified native binary
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokenclock-windows-parity
          path: |
            native-tests.log
            TokenClock-windows-x86_64.zip
            TokenClock-windows-x86_64.zip.sha256
