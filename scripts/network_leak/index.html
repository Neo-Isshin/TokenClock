<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Check · TokenClock</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263044;background:#ecf0f6;--line:#182f4b14;--card:#ffffff8c;--muted:#657188;--accent:#2b7e97}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#98e0e847,transparent 55%),radial-gradient(ellipse at 100% 32%,#b4a3ed30,transparent 50%);min-height:100vh}main{max-width:760px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:12px}.mark{font-size:26px;color:var(--accent);width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#ffffffb8,#b3dde348);border:1px solid #ffffff99;box-shadow:0 3px 12px #24365a0b}h1{font-size:23px;letter-spacing:-.7px;margin:0 0 4px;font-weight:720}p{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}.scope{font-size:10px;letter-spacing:.25px;color:var(--muted);margin:15px 0 8px}.toolbar{display:flex;align-items:center;gap:8px;margin:16px 0}button{font:600 12px -apple-system,sans-serif;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--card);color:inherit;transition:background .15s}button:hover{background:#c9dfe752}button.primary{background:var(--accent);color:#fff;border-color:transparent}button:disabled{opacity:.5;cursor:default}#browser{margin-left:auto;font-size:11px}.status{border-bottom:1px solid var(--line);padding:0 0 14px;margin-bottom:14px}.status strong{font-size:13px;font-weight:650;display:block;margin-bottom:3px}.card{margin:10px 0;border:1px solid #ffffffb0;outline:1px solid var(--line);border-radius:16px;padding:15px 16px;background:var(--card);box-shadow:0 3px 14px #25355706,inset 0 1px #ffffff99;backdrop-filter:blur(20px) saturate(140%)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.card h2{font-size:13px;margin:0;letter-spacing:-.1px}.badge{font-size:10px;border-radius:7px;padding:4px 7px;white-space:nowrap;background:#7e879715;color:var(--muted)}.badge[data-state=running]{color:#29719a;background:#3c9cc316}.badge[data-state=match]{color:#21836c;background:#27977c16}.badge[data-state=risk],.badge[data-state=review],.badge[data-state=invalid]{color:#956618;background:#bc8c2816}.card p{font-size:11px;margin-top:5px}.addresses{margin-top:10px;max-height:142px;overflow-y:auto;scrollbar-width:thin}.address{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;min-width:0}.address code{font-size:13px;font-family:ui-monospace,SFMono-Regular,monospace;font-weight:550;overflow-wrap:anywhere}.address span{font-size:10px;color:var(--muted);flex-shrink:0}.empty{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}details{margin:16px 0 12px}summary{font-size:11px;color:var(--muted);cursor:pointer}input{display:block;width:100%;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card);color:inherit;margin:9px 0 5px}details p{font-size:10px}.note{font-size:10.5px;line-height:1.7;margin:12px 0 10px}.privacy{font-size:9.5px;border-top:1px solid var(--line);padding-top:10px}button[hidden]{display:none}a{color:inherit}
@media(prefers-color-scheme:dark){:root{color:#e3e9f2;background:#1c2330;--line:#c4d8f216;--card:#2a354b91;--muted:#a0acc1;--accent:#397e97}.card{border-color:#b1cbe014;box-shadow:0 3px 14px #00000012,inset 0 1px #c6d4ed0d}.mark{border-color:#c9e1e722;background:linear-gradient(145deg,#a1d4e025,#b3dde30b)}.badge[data-state=match]{color:#87d5bd}.badge[data-state=risk],.badge[data-state=review],.badge[data-state=invalid]{color:#e3bb71}.badge[data-state=running]{color:#7cc8e5}}
@media(max-width:480px){main{padding:18px}h1{font-size:21px}.toolbar{flex-wrap:wrap}#browser{margin-left:0}.address{align-items:flex-start}.address code{font-size:12px}}
.checks-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.checks-grid .card{margin:0;min-width:0}.diagnostic-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}.diagnostic-row:last-child{border-bottom:0}.diagnostic-name{font-size:10px;color:var(--muted);min-width:63px;padding-top:2px}.diagnostic-row>div{min-width:0;flex:1}.diagnostic-row code{font:11px ui-monospace,monospace;overflow-wrap:anywhere}.diagnostic-row small{display:block;font-size:9px;color:var(--muted);line-height:1.5}.diagnostic-row[data-state=review] code{color:#a4762f}.policy{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px}.policy input{display:inline;width:auto;margin:0}.policy-hint,.scope-note{font-size:10px;line-height:1.6;margin-top:5px}.comparison{font-size:10px!important}.scope-note{margin-top:12px}.addresses{font-family:inherit}.checks-grid .card-top{align-items:flex-start}.checks-grid h2{line-height:1.5}.card h2{font-size:12px}.card{padding:13px}main{max-width:850px}.toolbar{margin:12px 0}.status{margin-bottom:12px;padding-bottom:12px}
@media(max-width:540px){.checks-grid{grid-template-columns:1fr}.diagnostic-name{min-width:86px}}
</style></head><body><main>
<header><div class="mark" aria-hidden="true"><svg width="26" height="29" viewBox="0 0 26 29" fill="none"><path d="M13 2 23 6v7c0 6-5 10-10 13C8 23 3 19 3 13V6L13 2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m8 14 3.3 3.3L18 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1 id="title">Network Check</h1><p id="subtitle"></p></div></header>
<div id="scope" class="scope"></div>
<div class="toolbar"><button id="start" class="primary">Start check</button><button id="stop" hidden>Stop</button><button id="browser" hidden>Check in browser ↗</button></div>
<div class="status" role="status" aria-live="polite"><strong id="overallSummary"></strong><strong id="idle"></strong><p id="idleHint"></p></div>
<div class="checks-grid"><section class="card"><div class="card-top"><h2 id="exitTitle"></h2><span id="exitBadge" class="badge"></span></div><p id="exitHint"></p><div id="exitAddresses" class="addresses empty">—</div></section>
<section class="card"><div class="card-top"><h2 id="dnsTitle"></h2><span id="dnsBadge" class="badge"></span></div><p id="dnsHint"></p><div id="dnsAddresses" class="addresses empty">—</div></section>
<section class="card"><div class="card-top"><h2 id="rtcTitle"></h2><span id="rtcBadge" class="badge"></span></div><p id="rtcHint"></p><div id="rtcAddresses" class="addresses empty">—</div></section>
<section class="card"><div class="card-top"><h2 id="consistencyTitle"></h2><span id="consistencyBadge" class="badge"></span></div><p id="consistencyHint"></p><p id="consistencyDetail" class="comparison"></p><div id="consistencyAddresses" class="addresses empty">—</div></section>
<section class="card"><div class="card-top"><h2 id="ipv6Title"></h2><span id="ipv6Badge" class="badge"></span></div><p id="ipv6Hint"></p><div id="ipv6Addresses" class="addresses empty">—</div></section>
<section class="card"><div class="card-top"><h2 id="aiTitle"></h2><span id="aiBadge" class="badge"></span></div><p id="aiHint"></p><div id="aiAddresses" class="addresses empty">—</div></section>
<section class="card"><div class="card-top"><h2 id="dohTitle"></h2><span id="dohBadge" class="badge"></span></div><p id="dohHint"></p><div id="dohAddresses" class="addresses empty">—</div></section></div>
<details><summary id="expectedTitle"></summary><input id="expected" aria-labelledby="expectedTitle" autocomplete="off" spellcheck="false"><p id="expectedHint"></p></details>
<label class="policy"><input id="ipv4Only" type="checkbox"><span id="ipv4OnlyLabel"></span></label><p id="policyHint" class="policy-hint"></p>
<p id="diagnosticScope" class="scope-note"></p><p id="note" class="note"></p><p id="privacy" class="privacy"></p>
</main><script src="/tokenclock/network-check/diagnostics.js"></script><script src="/tokenclock/network-check/probe.js"></script></body></html>
