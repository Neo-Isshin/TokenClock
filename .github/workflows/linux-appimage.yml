# Linux 云端构建仅保留为显式手动兜底。正式 AppImage 在自有 Debian 主机本地
# 构建并验收后上传到 release；推送共享版本 tag 不再自动触发 GitHub 编译。
name: linux-appimage

on:
  workflow_dispatch:       # 仅在确有需要时手动触发
    inputs:
      release_tag:
        description: 'Existing shared release tag, for example v1.4.4 (empty = use ref name)'
        required: false
        type: string

permissions:
  contents: write          # 附加资产到 release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - name: Checkout normal branch (Linux sources + build script)
        uses: actions/checkout@v4
        with:
          ref: normal

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Attach AppImage + SHA256 to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            TokenClock-x86_64.AppImage
            TokenClock-x86_64.AppImage.sha256
